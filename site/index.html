al jualan", "2,033 hours, 523 employees", "2,033 jam, 523 pekerja", 1, "B", "99",{"en": "A new online learning platform gives the sales team one place to take training, and lets managers track and measure each person's progress.", "bm": "Platform pembelajaran dalam talian baharu memberi pasukan jualan satu tempat untuk latihan, dan membolehkan pengurus memantau serta mengukur kemajuan setiap orang."}], ["Six Sigma training", "Latihan Six Sigma", "Technical and Production Academy course", "Kursus Technical and Production Academy", "30 employees trained", "30 pekerja dilatih", 1, "B", "99",{"en": "Six Sigma is a step-by-step method for finding the causes of defects and waste in a process and fixing them. Factory staff were trained in it.", "bm": "Six Sigma ialah kaedah langkah demi langkah untuk mencari punca kecacatan dan pembaziran dalam proses dan membaikinya. Kakitangan kilang dilatih dalam kaedah ini."}], ["NestCon 2025", "NestCon 2025", "AI skills for marketing staff", "Kemahiran AI untuk kakitangan pemasaran", "117 employees attended", "117 pekerja hadir", 1, "B", "99",{"en": "An event where marketing staff learned practical ways to use AI in their work.", "bm": "Acara di mana kakitangan pemasaran mempelajari cara praktikal menggunakan AI dalam kerja mereka."}], ["8 Life Saving Rules", "8 Life Saving Rules", "Safety rules and site safety tagging", "Peraturan keselamatan dan penandaan keselamatan", "24,738 safety tags raised", "24,738 tanda keselamatan", 1, "B", "101",{"en": "Simple safety rules for everyone, plus a tagging system where shop-floor workers flag hazards on the spot so they get fixed quickly.", "bm": "Peraturan keselamatan ringkas untuk semua, serta sistem penandaan di mana pekerja lantai kilang melaporkan bahaya di tempat supaya ia dibaiki dengan cepat."}], ["Nestlé Chilli Club", "Nestlé Chilli Club", "Local farmers supply fresh chillies", "Petani tempatan membekal cili segar", "361.9 MT (254.0 MT)", "361.9 MT (254.0 MT)", 2, "A", "80",{"en": "Nestlé trains and buys from local chilli farmers, who now supply most of its fresh chillies instead of imports.", "bm": "Nestlé melatih dan membeli daripada petani cili tempatan, yang kini membekalkan sebahagian besar cili segarnya menggantikan import."}], ["Nestlé Paddy Club", "Nestlé Paddy Club", "Local rice, farmer training", "Beras tempatan, latihan petani", "Yield 5.40 MT/ha", "Hasil 5.40 MT/ha", 2, "A", "81",{"en": "Local paddy farmers are trained in better and water-saving farming methods and sell their rice to Nestlé, giving it a steady local supply.", "bm": "Petani padi tempatan dilatih kaedah pertanian yang lebih baik dan menjimatkan air serta menjual beras kepada Nestlé, memberi bekalan tempatan yang stabil."}], ["Borneo Cocoa Initiative", "Borneo Cocoa Initiative", "Malaysian cocoa for KIT KAT", "Koko Malaysia untuk KIT KAT", "115 MT sourced", "115 MT diperoleh", 2, "B", "82",{"en": "Nestlé buys cocoa grown in Malaysia (Borneo) for a KIT KAT product, instead of relying only on imported cocoa.", "bm": "Nestlé membeli koko yang ditanam di Malaysia (Borneo) untuk produk KIT KAT, berbanding bergantung sepenuhnya pada koko import."}]], "appendix": [[1, "C", "16", "NESCAFÉ Espresso Concentrate production line", "Barisan pengeluaran NESCAFÉ Espresso Concentrate"], [1, "C", "18", "Digital planning, automated stock management and real-time production tracking", "Perancangan digital, pengurusan stok automatik dan pemantauan pengeluaran masa nyata"], [1, "C", "18", "Digital quality checks and AI safety solutions", "Semakan kualiti digital dan penyelesaian keselamatan AI"], [1, "C", "18", "Product portfolio simplification and cost-saving programme", "Pemudahan portfolio produk dan program penjimatan kos"], [1, "C", "16", "Enhanced e-commerce and channel execution", "E-dagang dan pelaksanaan saluran dipertingkat"], [2, "B", "75", "Responsible-sourcing supplier assessments", "Penilaian pembekal sumber bertanggungjawab"], [2, "C", "14", "Export hub as Nestlé Global Halal Centre of Excellence", "Hab eksport sebagai Nestlé Global Halal Centre of Excellence"], [3, "A", "55", "Energy efficiency projects and production optimisation", "Projek kecekapan tenaga dan pengoptimuman pengeluaran"], [3, "A", "55", "Chembong biomass boiler (renewable steam)", "Dandang biojisim Chembong (stim boleh baharu)"], [3, "A", "61", "Water efficiency projects (RO reject reuse, cooling tower optimisation, reuse of final discharge)", "Projek kecekapan air (guna semula air tolak RO, pengoptimuman menara penyejuk, guna semula air buangan akhir)"], [3, "A", "62", "Direct Potable Reuse System, Shah Alam", "Direct Potable Reuse System, Shah Alam"], [3, "A", "61", "Shah Alam wastewater treatment plant upgrade", "Naik taraf loji rawatan air sisa Shah Alam"], [3, "A", "13", "Virgin plastic reduction in packaging", "Pengurangan plastik dara dalam pembungkusan"], [3, "A", "67", "Project SAVE voluntary EPR recycling programme", "Program kitar semula EPR sukarela Project SAVE"], [3, "B", "55", "100% renewable electricity", "100% elektrik boleh baharu"], [3, "B", "55", "Cold-chain upgrade to natural refrigerants", "Naik taraf rantaian sejuk kepada penyejuk semula jadi"], [3, "B", "57", "Zero waste to landfill and coffee grounds to fuel", "Sifar sisa ke tapak pelupusan dan hampas kopi sebagai bahan api"], [3, "C", "52", "Car fleet switch to hybrid/EV", "Tukar kenderaan syarikat kepada hibrid/EV"]], "strengths": {"en": ["Value added per employee rose 18.6% to RM356,595 in FY2025, while headcount fell to 4,765 from 5,036.", "Inventory turnover improved to 5.53× from 4.95× in FY2023, the fastest in the five years reviewed."], "bm": ["Nilai ditambah bagi setiap pekerja naik 18.6% kepada RM356,595 pada FY2025, manakala bilangan pekerja turun kepada 4,765 daripada 5,036.", "Pusing ganti inventori meningkat kepada 5.53× daripada 4.95× pada FY2023, paling pantas dalam lima tahun yang dikaji."]}, "watch": {"en": ["Value added per RM1 staff cost was RM2.30, below RM2.70 in FY2022, as average staff cost per employee rose to RM155,009.", "The recordable injury rate rose to 0.45 from 0.29 in 2025, with six recordable work-related injuries."], "bm": ["Nilai ditambah bagi setiap RM1 kos kakitangan ialah RM2.30, di bawah RM2.70 pada FY2022, kerana purata kos kakitangan bagi setiap pekerja naik kepada RM155,009.", "Kadar kecederaan boleh rekod naik kepada 0.45 daripada 0.29 pada 2025, dengan enam kecederaan berkaitan kerja."]}, "lessons": [{"type": {"en": "Workforce and skills", "bm": "Tenaga kerja/kemahiran"}, "title": {"en": "Fund more operator training hours using the HRD Corp levy you already pay", "bm": "Tambah jam latihan operator dengan levi HRD Corp yang sudah dibayar"}, "body": {"en": ["Nestlé Malaysia raised training investment to RM12.35 million in 2025, including RM7 million from HRD Corp. Local training hours rose to 65,874 from 56,099. (pp.98, 99)", "Most 50–200 person firms pay the HRD Corp levy. Claim it for short, job-specific courses for operators and supervisors rather than leaving it unused.", "Check your HRD Corp levy balance this month and book one course for your busiest line.", "Training hours per employee and levy used each quarter."], "bm": ["Nestlé Malaysia menaikkan pelaburan latihan kepada RM12.35 juta pada 2025, termasuk RM7 juta daripada HRD Corp. Jam latihan tempatan naik kepada 65,874 daripada 56,099. (hlm.98, 99)", "Kebanyakan syarikat 50–200 orang membayar levi HRD Corp. Tuntut untuk kursus pendek khusus kerja bagi operator dan penyelia.", "Semak baki levi HRD Corp bulan ini dan tempah satu kursus untuk barisan paling sibuk.", "Jam latihan bagi setiap pekerja dan levi digunakan setiap suku tahun."]}}, {"type": {"en": "Supply chain", "bm": "Rantaian bekalan"}, "title": {"en": "Grow a local supplier base by training growers and buying their output", "bm": "Bina pembekal tempatan dengan melatih petani dan membeli hasil mereka"}, "body": {"en": ["Through the Nestlé Chilli Club, 91 local farmers supplied over 86% of Nestlé Malaysia's fresh chilli needs in 2025, with training in sustainable farming. Purchases rose to 361.9 MT from 254.0 MT. (p.80)", "If one input often arrives late, train two or three nearby suppliers to your standard and agree a fixed offtake. Suits food processors using fresh produce.", "List your three most delayed inputs and one nearby supplier who could grow or make each.", "Share of inputs bought locally and on-time delivery rate."], "bm": ["Melalui Nestlé Chilli Club, 91 petani tempatan membekal lebih 86% keperluan cili segar pada 2025. Pembelian naik kepada 361.9 MT daripada 254.0 MT. (hlm.80)", "Jika satu input sering lewat, latih dua atau tiga pembekal berdekatan dan janjikan belian tetap. Sesuai untuk pemproses makanan.", "Senaraikan tiga input paling kerap lewat dan satu pembekal berdekatan bagi setiap satu.", "Bahagian input dibeli secara tempatan dan kadar penghantaran tepat masa."]}}, {"type": {"en": "Process and maintenance", "bm": "Proses/penyelenggaraan"}, "title": {"en": "Let operators tag problems on the spot, and close every tag", "bm": "Biar operator tanda masalah di tempat, dan tutup setiap tanda"}, "body": {"en": ["Under its Total Productive Maintenance approach, shop-floor teams raised 24,738 safety tags in 2025, each escalated and tracked to closure. The recordable injury rate still rose to 0.45 from 0.29. (p.101)", "A tag board by each line lets operators flag leaks, loose guards or faults before they cause stoppages or injuries. Review open tags at the daily stand-up.", "Put a tag board at your busiest line this week and review open tags daily.", "Tags raised and closed per week, and unplanned stops per shift."], "bm": ["Melalui Total Productive Maintenance, pasukan kilang menaikkan 24,738 tanda keselamatan pada 2025, semuanya dipantau hingga ditutup. Kadar kecederaan masih naik kepada 0.45 daripada 0.29. (hlm.101)", "Papan tanda di setiap barisan membolehkan operator melapor kerosakan sebelum berlaku henti tugas atau kecederaan. Semak tanda terbuka setiap hari.", "Letakkan papan tanda di barisan paling sibuk dan semak tanda terbuka setiap hari.", "Tanda dibuka dan ditutup seminggu, dan henti tugas tidak dirancang setiap syif."]}}], "notes": {"en": ["Sources: Nestlé (Malaysia) Berhad Annual Report 2025, Corporate Governance & Financial Reports 2025, 2024 and 2022, CSV & Sustainability Report 2025. Figures as reported, not independently audited. Value added is an analyst proxy. Not investment advice."], "bm": ["Sumber: Laporan Tahunan 2025, Laporan Tadbir Urus Korporat & Kewangan 2025, 2024 dan 2022, Laporan CSV & Kelestarian 2025 Nestlé (Malaysia) Berhad. Angka seperti yang dilaporkan syarikat, tidak diaudit secara bebas. Nilai ditambah ialah anggaran penganalisis. Bukan nasihat pelaburan."]}, "dtfNote": {"en": "Nestlé is compared with its own FY2021 starting point for now. Its peer group is the five food and beverage makers (Dutch Lady, F&N, Farm Fresh, Nestlé, Spritzer), which have 19 company-years so far, one short of the 20 needed for a frontier. Value added per employee was 14% above FY2021 in FY2025 (index 114).", "bm": "Buat masa ini Nestlé dibandingkan dengan titik permulaan FY2021nya sendiri. Kumpulan rakan setaranya ialah lima pengeluar makanan dan minuman (Dutch Lady, F&N, Farm Fresh, Nestlé, Spritzer), yang mempunyai 19 tahun-syarikat setakat ini, kurang satu daripada 20 yang diperlukan untuk sempadan. Nilai ditambah bagi setiap pekerja pada FY2025 adalah 14% di atas FY2021 (indeks 114)."}},

function dtfChart(series){ /* series: [{v:[5 values],role}] — attainment %, frontier = 100 */
  const W=520,H=300,l=44,r=36,t=30,b=36,yrs=DTF.years,T=DTF_TXT[lang];
  const X=i=>l+i*(W-l-r)/(yrs.length-1), Y=v=>t+(100-v)*(H-t-b)/100;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(T.medH)}" font-family="Geist, Arial, sans-serif" font-size="12">`;
  [0,25,50,75].forEach(v=>{s+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#DDDBE4" stroke-width="1"/><text x="${l-8}" y="${Y(v)+4}" text-anchor="end" fill="#8A8A96">${v}%</text>`;});
  s+=`<line x1="${l}" x2="${W-r}" y1="${Y(100)}" y2="${Y(100)}" stroke="#0B0B0F" stroke-width="1.5" stroke-dasharray="2 4"/><text x="${l-8}" y="${Y(100)+4}" text-anchor="end" fill="#8A8A96">100%</text><text x="${l}" y="${Y(100)-9}" fill="#0B0B0F" font-size="11.5">${esc(T.frLbl)} = 100</text>`;
  yrs.forEach((y,i)=>{s+=`<text x="${X(i)}" y="${H-10}" text-anchor="middle" fill="#8A8A96">FY${y}</text>`;});
  series.forEach(se=>{const col=se.role==="co"?"#9466FF":"#0B0B0F",dash=se.role==="co"?"":'stroke-dasharray="6 5"',w=se.role==="co"?3.5:2;
    const pts=se.v.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(pts.length>1)s+=`<polyline fill="none" stroke="${col}" stroke-width="${w}" ${dash} points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
    pts.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${se.role==="co"?5:3.5}" fill="${col}"/>`;});});
  return s+`</svg>`;
}

  document.querySelectorAll("[data-lang]").forEach(b=>{b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("pl-lang",lang);}catch(e){}const y=scrollY;const open=!document.getElementById("menuSheet").hidden;route();scrollTo(0,y);if(open)openMenu();};});
  const mc=document.getElementById("menuClose");if(mc)mc.onclick=closeMenu;
  document.querySelectorAll("#menuSheet a").forEach(a=>a.addEventListener("click",closeMenu));
}
/* menu sheet */
const menuBtn=document.getElementById("menuBtn"),sheet=document.getElementById("menuSheet");
function openMenu(){sheet.hidden=false;menuBtn.setAttribute("aria-expanded","true");document.body.style.overflow="hidden";const f=sheet.querySelector("a.big");if(f)f.focus();}
function closeMenu(){sheet.hidden=true;menuBtn.setAttribute("aria-expanded","false");document.body.style.overflow="";}
menuBtn.addEventListener("click",openMenu);
/* search */
const sBox=document.getElementById("searchBox");
function openSearch(){const n=NAV[lang];
  sBox.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-label="${n.search}"><input type="search" id="sq" placeholder="${n.search}" aria-label="${n.search}" autocomplete="off"><div class="res" id="sres"></div><div class="hint">${n.hint}</div></div>`;
  sBox.hidden=false;document.body.style.overflow="hidden";const q=document.getElementById("sq");q.focus();q.addEventListener("input",()=>renderSearch(q.value));renderSearch("");}
function closeSearch(){sBox.hidden=true;sBox.innerHTML="";document.body.style.overflow="";}
function renderSearch(q){const n=NAV[lang],s=q.trim().toLowerCase(),out=document.getElementById("sres");
  if(!s){out.innerHTML=`<div class="grp">${n.grpS}</div>`+COMPANIES.map(c=>`<a href="#${c.slug}"><b>${esc(c.name)}</b><span>${esc(c.headline[lang])}</span></a>`).join("");return;}
  const cs=COMPANIES.filter(c=>(c.name+" "+c.short+" "+c.headline[lang]+" "+c.code).toLowerCase().includes(s));
  const is=allInitiatives().filter(r=>r.name.toLowerCase().includes(s)).slice(0,14);
  out.innerHTML=(cs.length?`<div class="grp">${n.grpS}</div>`+cs.map(c=>`<a href="#${c.slug}"><b>${esc(c.name)}</b><span>${esc(c.headline[lang])}</span></a>`).join(""):"")
    +(is.length?`<div class="grp">${n.grpI}</div>`+is.map(r=>`<a href="#${r.co.slug}" data-goto="sec-init"><b>${esc(r.name)}</b><span>${esc(r.co.short)} · ${pageRef(r.p)}</span></a>`).join(""):"")
    ||`<div class="none">${n.none}</div>`;}
document.getElementById("searchBtn").addEventListener("click",openSearch);
sBox.addEventListener("click",e=>{const a=e.target.closest("a");if(a){if(a.dataset.goto)pendingSection=a.dataset.goto;closeSearch();return;}if(e.target===sBox)closeSearch();});
addEventListener("keydown",e=>{if(e.key==="Escape"){if(!sBox.hidden)closeSearch();if(!sheet.hidden)closeMenu();}
  if(e.key==="/"&&sBox.hidden&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();openSearch();}});
/* back to top */
const toTop=document.getElementById("toTop");
toTop.addEventListener("click",()=>scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}));
addEventListener("scroll",()=>toTop.classList.toggle("show",scrollY>900),{passive:true});
addEventListener("hashchange",()=>{route();if(pendingSection){const id=pendingSection;pendingSection=null;requestAnimationFrame(()=>{const el=document.getElementById(id);if(el)el.scrollIntoView();else scrollTo(0,0);});}else scrollTo(0,0);});
const topEl=document.querySelector(".top");addEventListener("scroll",()=>topEl.classList.toggle("scrolled",scrollY>8),{passive:true});
route();
</script>
</body>
</html>
