<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productivity Lens</title>
<style>
:root{--bg:#faf8f4;--fg:#1d1d1b;--muted:#5f5d58;--line:#e2ddd3;--accent:#1f5f5b;}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#eceae5;--muted:#a6a39c;--line:#2e2d2a;--accent:#6fb3ac;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 Georgia,"Times New Roman",serif}
main{max-width:760px;margin:0 auto;padding:56px 16px}
h1{font-size:2.4rem;margin:0 0 8px;letter-spacing:-.01em}
.lede{color:var(--muted);font-family:system-ui,sans-serif;margin:0 0 40px}
h2{font-size:1.1rem;font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:8px}
ul{list-style:none;padding:0;margin:0}
li{padding:16px 0;border-bottom:1px solid var(--line)}
li a{color:var(--fg);font-weight:bold;text-decoration:none}
li a:hover{text-decoration:underline}
.meta{color:var(--muted);font:14px system-ui,sans-serif}
.empty{color:var(--muted);font-family:system-ui,sans-serif}
footer{margin-top:56px;color:var(--muted);font:13px system-ui,sans-serif}
</style>
</head>
<body>
<main>
  <h1>Productivity Lens</h1>
  <p class="lede">Productivity spotlights on Bursa Malaysia listed companies, drawn from their annual and sustainability reports.</p>
  <h2>Spotlights</h2>
  <ul id="list"><li class="empty">Loading…</li></ul>
  <footer>Figures are taken from company reports and cited by page.</footer>
</main>
<script>
fetch('data/spotlights.json').then(r=>r.json()).then(items=>{
  const ul=document.getElementById('list'); ul.innerHTML='';
  if(!items.length){ul.innerHTML='<li class="empty">No spotlights published yet.</li>';return;}
  for(const s of items){
    const li=document.createElement('li');
    const a=document.createElement('a'); a.href=s.pdf||'#'; a.textContent=s.headline||s.company;
    const m=document.createElement('div'); m.className='meta';
    m.textContent=[s.company,s.sector,s.fy&&('FY'+s.fy)].filter(Boolean).join(' · ');
    li.append(a,m); ul.append(li);
  }
}).catch(()=>{document.getElementById('list').innerHTML='<li class="empty">Could not load spotlights.</li>';});
</script>
</body>
</html>
